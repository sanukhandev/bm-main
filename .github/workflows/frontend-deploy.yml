name: Frontend CI/CD

on:
  push:
    branches: [dev-release]
    paths:
      - "frontend"
      - "frontend/**"
      - "README.md"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_OPTIONS: >-
        -o ConnectTimeout=30
        -o ConnectionAttempts=3
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run build -- --configuration production

      - name: Package Angular production files
        run: (cd dist/bm-frontend/browser && zip -rq ../../../frontend-release.zip .)

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH host verification
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare frontend release directory
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.CPANEL_FRONTEND_PATH }}
        run: sshpass -e ssh $SSH_OPTIONS -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/.deploy'"

      - name: Upload frontend archive
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.CPANEL_FRONTEND_PATH }}
        run: sshpass -e scp $SSH_OPTIONS -P "${SSH_PORT:-22}" frontend-release.zip "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/.deploy/frontend-${GITHUB_SHA}.zip"

      - name: Extract frontend archive on server
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.CPANEL_FRONTEND_PATH }}
        run: |
          sshpass -e ssh $SSH_OPTIONS -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "set -eu; target='$DEPLOY_PATH'; archive=\"\$target/.deploy/frontend-${GITHUB_SHA}.zip\"; temp=\"\$target/.deploy/frontend-${GITHUB_SHA}\"; rm -rf \"\$temp\"; mkdir -p \"\$temp\"; unzip -oq \"\$archive\" -d \"\$temp\"; cp -a \"\$temp/.\" \"\$target/\"; rm -rf \"\$temp\" \"\$archive\""
