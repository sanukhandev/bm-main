name: Backend CI/CD

on:
  push:
    branches: [dev-release]
    paths:
      - "backend/**"
      - "README.md"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_OPTIONS: >-
        -o ConnectTimeout=30
        -o ConnectionAttempts=3
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Package Laravel application
        run: |
          zip -rq ../backend-release.zip . \
            -x '.git/*' '.env' 'vendor/*' 'node_modules/*' 'tests/*' \
            'storage/logs/*' 'storage/framework/cache/*' \
            'storage/framework/sessions/*' 'storage/framework/views/*' \
            'phpunit.xml' 'package.json' 'package-lock.json' 'vite.config.js' \
            'README.md' 'AGENTS.md'

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH host verification
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare backend release directory
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.CPANEL_BACKEND_PATH }}
        run: sshpass -e ssh $SSH_OPTIONS -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/.deploy'"

      - name: Upload backend archive
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.CPANEL_BACKEND_PATH }}
        run: sshpass -e scp $SSH_OPTIONS -P "${SSH_PORT:-22}" ../backend-release.zip "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/.deploy/backend-${GITHUB_SHA}.zip"

      - name: Extract backend archive on server
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.CPANEL_BACKEND_PATH }}
        run: |
          sshpass -e ssh $SSH_OPTIONS -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "set -eu; target='$DEPLOY_PATH'; archive=\"\$target/.deploy/backend-${GITHUB_SHA}.zip\"; temp=\"\$target/.deploy/backend-${GITHUB_SHA}\"; rm -rf \"\$temp\"; mkdir -p \"\$temp\"; unzip -oq \"\$archive\" -d \"\$temp\"; cp -a \"\$temp/.\" \"\$target/\"; rm -rf \"\$temp\" \"\$archive\"; cd \"\$target\"; mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache; php artisan config:clear --no-interaction; php artisan route:clear --no-interaction; php artisan view:clear --no-interaction"
